# Reusable PREPARE-RELEASE workflow for agent-tool plugins.
#
# Release model: COMMIT-TO-MAIN. Both Claude (`/plugin install`) and Codex
# install a plugin from the repo's DEFAULT BRANCH; neither consults git tags, and
# updates are driven by the `version` field in the manifests (a bumped version is
# what makes a client pull new content). So a "release" is simply: build the
# per-arch binaries in CI, stamp + sign them, bump the version, and COMMIT it all
# to the default branch. There are NO tags, NO GitHub Releases, NO tarballs, and
# nothing is built on anyone's laptop.
#
# Each tool's .github/workflows/release.yml is a thin caller, triggered ON DEMAND
# when you're ready to cut a release:
#
#   name: Release
#   on:
#     workflow_dispatch:
#       inputs:
#         version: { description: "x.y.z", required: true }
#   jobs:
#     release:
#       # Pin to an immutable commit SHA — this workflow COMMITS to your default
#       # branch, so it runs with contents:write. Bump the pin deliberately.
#       uses: aac/plugin-release-kit/.github/workflows/release-plugin.yml@<commit-sha>
#       with:
#         tool: ask                       # optional; defaults to the repo name
#         version: ${{ inputs.version }}
#       permissions:
#         contents: write
#
# What it does on dispatch:
#   1. bump-version  — write <version> into SKILL.md + the manifests.
#   2. stage-binaries — cross-compile all arches, STAMP the version
#      (-ldflags -X <module>/internal/version.Binary=<version>), ad-hoc-sign
#      darwin, write the launcher, into the tracked bin/.
#   3. verify-release — conformance gate (0 FAIL required), incl. the version
#      smoke test that fails a dev/stale stamp.
#   4. commit + push the result to the default branch. That IS the release.

on:
  workflow_call:
    inputs:
      tool:
        description: "Tool/binary name (defaults to the caller repo name)"
        type: string
        required: false
        default: ""
      version:
        description: "Release version, x.y.z (written into the manifests + stamped into the binaries)"
        type: string
        required: true
      go-version:
        type: string
        required: false
        default: "1.25"

jobs:
  release:
    # macOS so stage-binaries can ad-hoc codesign darwin (unsigned arm64 is
    # SIGKILL'd). Free; no Apple Developer account.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tool repo (default branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout plugin-release-kit
        # Pin to the exact commit of THIS reusable workflow (job_workflow_sha) so
        # the kit scripts come from the same immutable commit the caller pinned.
        uses: actions/checkout@v4
        with:
          repository: aac/plugin-release-kit
          ref: ${{ github.job_workflow_sha }}
          path: _kit

      - name: Hide _kit from the tool's git status
        run: echo '/_kit/' >> .git/info/exclude

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Resolve tool name
        id: tool
        env:
          TOOL_INPUT: ${{ inputs.tool }}
        run: |
          t="$TOOL_INPUT"
          [ -n "$t" ] || t="${GITHUB_REPOSITORY##*/}"
          case "$t" in *[!a-zA-Z0-9._-]*) echo "invalid tool name: $t" >&2; exit 1 ;; esac
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          V: ${{ inputs.version }}
        run: |
          case "$V" in
            ''|*[!0-9.]*) echo "invalid version '$V' — want x.y.z (digits and dots)" >&2; exit 1 ;;
          esac

      - name: Bump version across the manifests
        env:
          V: ${{ inputs.version }}
        run: bash _kit/bin/bump-version "$V" --repo .

      - name: Stage binaries (build all arches, stamp version, sign darwin)
        env:
          TOOL: ${{ steps.tool.outputs.name }}
        run: bash _kit/bin/stage-binaries --repo . --tool "$TOOL"

      - name: Commit the release to the default branch (gated by verify-release)
        env:
          TOOL: ${{ steps.tool.outputs.name }}
          V: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # verify-release reads the index (git ls-files) and runs the committed
          # binary's version smoke test — gate the release on 0 FAIL before push.
          bash _kit/bin/verify-release --repo .
          if git diff --cached --quiet; then
            echo "nothing to commit — manifests + binaries already at v$V"; exit 0
          fi
          git commit -m "release $TOOL v$V"
          git push origin "HEAD:${GITHUB_REF_NAME}"
