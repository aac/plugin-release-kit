# Reusable release workflow for agent-tool plugins.
#
# This is the ONE canonical release mechanism. Each tool repo's own
# .github/workflows/release.yml is a thin caller:
#
#   name: Release
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     release:
#       # Pin to an immutable commit SHA (this workflow runs with contents:write).
#       uses: aac/plugin-release-kit/.github/workflows/release-plugin.yml@<commit-sha>
#       with:
#         tool: ask            # optional; defaults to the repo name
#       permissions:
#         contents: write
#
# What it produces on a vX.Y.Z tag:
#   * GoReleaser cross-compiles + ad-hoc-signs the binary tarballs (the
#     go-install / curl|sh path) using the caller repo's own .goreleaser.yml.
#   * build-plugin.sh assembles the self-contained <tool>-plugin.zip (skill +
#     manifests, and for binary tools the multi-arch binary + launcher) and
#     attaches it to the draft GitHub Release. This is what `/plugin install
#     <tool>@<tool>` consumes.
#
# Binary-into-plugin specifics converge with the act repo's release work; the
# seam (every tool `uses:` this file) is the durable part.

on:
  workflow_call:
    inputs:
      tool:
        description: "Tool/binary name (defaults to the caller repo name)"
        type: string
        required: false
        default: ""
      go-version:
        type: string
        required: false
        default: "1.25"

jobs:
  release:
    # macOS so the GoReleaser post-hook can ad-hoc codesign darwin binaries
    # (unsigned arm64 is SIGKILL'd). Free; no Apple Developer account.
    runs-on: macos-latest
    steps:
      - name: Checkout tool repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout plugin-release-kit
        # Pin to the exact commit of THIS reusable workflow (job_workflow_sha),
        # so build-plugin.sh comes from the same immutable commit the caller
        # pinned. Lands in _kit/ inside the workspace; the next step hides it
        # from the tool's git status so GoReleaser sees a clean tree.
        uses: actions/checkout@v4
        with:
          repository: aac/plugin-release-kit
          ref: ${{ github.job_workflow_sha }}
          path: _kit

      - name: Hide _kit from the tool's git status
        run: echo '/_kit/' >> .git/info/exclude

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Resolve tool name
        id: tool
        env:
          TOOL_INPUT: ${{ inputs.tool }}
        run: |
          t="$TOOL_INPUT"
          [ -n "$t" ] || t="${GITHUB_REPOSITORY##*/}"
          # Validate before it reaches a shell command or a filename.
          case "$t" in
            *[!a-zA-Z0-9._-]*) echo "invalid tool name: $t" >&2; exit 1 ;;
          esac
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: GoReleaser (binary tarballs + checksums)
        if: hashFiles('.goreleaser.yml', '.goreleaser.yaml') != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed darwin/arm64 binary executes
        # Binary tools only: the macOS runner is Apple Silicon, so run the
        # freshly ad-hoc-signed darwin/arm64 build. An unsigned arm64 binary is
        # SIGKILL'd (rc >= 128) — fail the release instead of shipping a dead
        # binary. No-op for skill-only tools (no dist binary).
        if: hashFiles('.goreleaser.yml', '.goreleaser.yaml') != ''
        env:
          TOOL: ${{ steps.tool.outputs.name }}
        run: |
          bin=$(find dist -type f -name "$TOOL" -path '*darwin*arm64*' 2>/dev/null | head -1)
          [ -n "$bin" ] || { echo "no darwin/arm64 binary in dist — skipping"; exit 0; }
          "$bin" version >/dev/null 2>&1; rc=$?
          if [ "$rc" -ge 128 ]; then echo "FAIL: $bin killed by signal $((rc-128)) — ad-hoc signing did not take"; exit 1; fi
          echo "OK: $bin executes (rc=$rc) — ad-hoc signature valid"

      - name: Build self-contained plugin zip
        # Write the zip to RUNNER_TEMP (outside the tool tree). build-plugin.sh
        # itself only reads the tool repo + stages in its own tmpdir, so the tree
        # stays clean.
        env:
          TOOL: ${{ steps.tool.outputs.name }}
        run: |
          bash _kit/bin/build-plugin.sh \
            --repo . \
            --tool "$TOOL" \
            --ref "$GITHUB_REF_NAME" \
            --out "$RUNNER_TEMP/$TOOL-plugin.zip"

      - name: Attach plugin zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL: ${{ steps.tool.outputs.name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$TOOL-plugin.zip" --clobber
